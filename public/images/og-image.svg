<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!--
    分享卡片底图。刻意只用纯色：PNG 对渐变的抖动编码会把体积推到几百 KB，
    而 QQ / 微信这类抓取器对 og:image 有大小与超时阈值，图太重就只剩标题没图。
    改这里之后需要重新光栅化同名 PNG（见 docs/seo/SEO与GEO策略.md §6）。
  -->
  <rect width="1200" height="630" fill="#0b1a12" />
  <rect x="600" width="600" height="630" fill="#0f2418" />
  <rect x="880" width="320" height="630" fill="#123a28" />

  <!-- 右侧 bento 网格：暗示「一格一个工具」，不参与文字信息层 -->
  <g>
    <rect x="880" y="150" width="110" height="110" rx="22" fill="#0ea95e" />
    <rect x="1006" y="150" width="110" height="110" rx="22" fill="#1c3a2a" />
    <rect x="880" y="276" width="110" height="110" rx="22" fill="#1c3a2a" />
    <rect x="1006" y="276" width="110" height="110" rx="22" fill="#155c38" />
    <rect x="880" y="402" width="236" height="80" rx="22" fill="#16301f" />
  </g>

  <text x="80" y="150" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="30" fill="#7fe0ae" letter-spacing="4">
    TOOLBOX
  </text>

  <text x="80" y="248" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="76" font-weight="700" fill="#ffffff">
    MmzMing的工具箱
  </text>

  <text x="80" y="316" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="34" fill="#cfe9db">
    免费开源的在线工具箱 · 50+ 开发者实用工具
  </text>

  <text x="80" y="372" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="28" fill="#8fb9a1">
    全部在浏览器本地运行，不收集、不上传任何数据
  </text>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="26" fill="#cfe9db">
    <rect x="80" y="440" width="132" height="58" rx="16" fill="#16301f" stroke="#1f4b33" />
    <text x="146" y="478" text-anchor="middle">加密</text>
    <rect x="224" y="440" width="132" height="58" rx="16" fill="#16301f" stroke="#1f4b33" />
    <text x="290" y="478" text-anchor="middle">转换</text>
    <rect x="368" y="440" width="152" height="58" rx="16" fill="#16301f" stroke="#1f4b33" />
    <text x="444" y="478" text-anchor="middle">编解码</text>
    <rect x="532" y="440" width="112" height="58" rx="16" fill="#16301f" stroke="#1f4b33" />
    <text x="588" y="478" text-anchor="middle">Web</text>
    <rect x="656" y="440" width="112" height="58" rx="16" fill="#16301f" stroke="#1f4b33" />
    <text x="712" y="478" text-anchor="middle">文本</text>
    <rect x="780" y="440" width="112" height="58" rx="16" fill="#16301f" stroke="#1f4b33" />
    <text x="836" y="478" text-anchor="middle">图片</text>
  </g>

  <text x="80" y="562" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="26" fill="#5f8b72">
    tool.mmzhiku.xyz
  </text>
</svg>
