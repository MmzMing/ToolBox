server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 纵深防御：站内多处把用户/模型内容写进 innerHTML，消毒器一旦被绕过还有这层。
    # - script-src 不含 unsafe-inline：唯一的内联脚本（主题防闪烁）已外置到 public/theme-init.js
    # - 'wasm-unsafe-eval'：图片压缩与 pdf.js 的同源 WASM 需要流式编译
    # - style-src 'unsafe-inline'：React 与 Radix 大量使用 style 属性，去掉会直接画崩界面
    # - connect-src 放行任意 https：简历工坊的可选 AI 由用户自填服务商地址，浏览器直连
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}
